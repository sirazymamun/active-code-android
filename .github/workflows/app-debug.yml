name: Build and test active-code-v5.1.8 debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [source.zip, apk-version.txt, .github/workflows/app-debug.yml, 'Signing/**']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract source and set version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, zipfile
          root = pathlib.Path.cwd()
          version = (root / 'apk-version.txt').read_text().strip()
          if not re.fullmatch(r'\d{1,3}\.\d{1,2}\.\d{1,3}', version):
              raise SystemExit('apk-version.txt must contain a version such as 5.1.8')
          dest = root / 'build-source'
          dest.mkdir()
          with zipfile.ZipFile(root / 'source.zip') as archive:
              required = {
                  'package.json', 'package-lock.json',
                  'test/vlc-stubs/android/content/Context.java',
                  'test/vlc-stubs/android/net/Uri.java',
                  'test/vlc-stubs/android/os/Handler.java',
                  'test/vlc-stubs/android/os/Looper.java',
                  'test/vlc-stubs/android/view/ViewGroup.java',
                  'test/vlc-stubs/android/view/View.java',
                  'test/vlc-stubs/android/os/SystemClock.java',
                  'test/vlc-stubs/org/videolan/libvlc/interfaces/IMedia.java',
                  'native/java/FrameHold.java.tpl',
                  'tools/TestFrameHold.java',
                  'test/frame-hold-stubs/com/tv2u/app/FrameHoldTest.java',
              }
              missing = sorted(required.difference(archive.namelist()))
              if missing:
                  raise SystemExit('Incomplete source.zip; missing: ' + ', '.join(missing))
              if archive.testzip() is not None:
                  raise SystemExit('Damaged source.zip (CRC mismatch)')
              for name in ('package.json', 'package-lock.json'):
                  data = json.loads(archive.read(name))
                  if data['version'] != version or (name == 'package-lock.json' and data['packages']['']['version'] != version):
                      raise SystemExit('Version mismatch in source.zip/' + name)
              for entry in archive.infolist():
                  if not (dest / entry.filename).resolve().is_relative_to(dest):
                      raise SystemExit('Unsafe archive path')
              archive.extractall(dest)
          shutil.copyfile(root / 'apk-version.txt', dest / 'apk-version.txt')
          for name in ['package.json', 'package-lock.json']:
              path = dest / name
              data = json.loads(path.read_text())
              data['version'] = version
              if name == 'package-lock.json':
                  data['packages']['']['version'] = version
              path.write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('label=active-code-v' + version + '\n')
          print('Building active-code-v' + version)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build-source/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: build-source
      - run: npm run web:build && npm run check:compat && npm test
        working-directory: build-source
      - run: python3 -m unittest discover -s test -p "*_test.py"
        working-directory: build-source
      - run: java tools/TestBigStore.java
        working-directory: build-source
      - run: java -Xmx192m tools/TestCatalogueImport.java
        working-directory: build-source
      - run: java tools/TestVlcLifecycle.java
        working-directory: build-source
      - run: java tools/TestFrameHold.java
        working-directory: build-source
      - run: java tools/TestPlaybackPolicy.java
        working-directory: build-source
      - run: java tools/TestFieldInitializers.java
        working-directory: build-source
      - run: java tools/TestRecordingLifecycle.java
        working-directory: build-source
      - run: java tools/TestExoDeadline.java
        working-directory: build-source
      - run: java tools/TestNetworkTraffic.java
        working-directory: build-source
      - name: Generate and sync Android
        run: npx cap add android && npx cap sync android
        working-directory: build-source
      - name: Restore bundled debug signing key
        shell: bash
        run: |
          python3 - <<'PYKEY'
          import os, pathlib, shutil
          key = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'Signing/active-code-debug-signing.keystore'
          if not key.is_file():
              raise SystemExit('Missing Signing/active-code-debug-signing.keystore; upload the complete Signing folder from this Full ZIP.')
          home = pathlib.Path.home()
          destinations = {home / '.android' / 'debug.keystore'}
          if os.environ.get('ANDROID_USER_HOME'):
              destinations.add(pathlib.Path(os.environ['ANDROID_USER_HOME']) / 'debug.keystore')
          if os.environ.get('ANDROID_SDK_HOME'):
              destinations.add(pathlib.Path(os.environ['ANDROID_SDK_HOME']) / '.android' / 'debug.keystore')
          destinations.add(pathlib.Path(os.environ.get('XDG_CONFIG_HOME', str(home / '.config'))) / '.android' / 'debug.keystore')
          for target in destinations:
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(key, target)
              target.chmod(0o600)
          print('Bundled debug signing key restored; future debug builds reuse the same certificate.')
          PYKEY
      - name: Build and lint APK plus instrumentation tests
        working-directory: build-source/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Save lint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: active-code-v5.1.8-debug-lint-reports
          path: |
            build-source/android/app/build/reports/lint-results-*
            build-source/android/app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: ignore
      - name: Verify and collect single ARM debug APK
        env:
          APK_LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p artifacts
          apk="build-source/android/app/build/outputs/apk/debug/app-debug.apk"
          python3 build-source/tools/check_android_artifact.py "$apk" --allow-32bit --expected-abi arm64-v8a,armeabi-v7a --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          cp "$apk" "artifacts/active-code.apk"
          python3 build-source/tools/report_apk_sizes.py artifacts > artifacts/APK-SIZES.txt
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.label }}-debug
          path: artifacts/*
          if-no-files-found: error
      - name: Build internal emulator test APKs
        working-directory: build-source/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PactiveCodeEmulator=true --no-daemon
      - name: Collect internal emulator artifacts
        env:
          APK_LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p emulator-artifacts
          cp build-source/android/app/build/outputs/apk/debug/app-debug.apk "emulator-artifacts/${APK_LABEL}-x86_64-debug.apk"
          cp build-source/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk emulator-artifacts/android-test.apk
          cp build-source/tools/run_emulator.py emulator-artifacts/run_emulator.py
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.label }}-emulator-internal
          path: emulator-artifacts/*
          if-no-files-found: error
  android-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [24, latest, latest-16k]
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
      - name: Download app and test APKs from this run
        env:
          GH_TOKEN: ${{ github.token }}
          APK_LABEL: ${{ needs.build.outputs.label }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${APK_LABEL}-emulator-internal" --dir artifacts
      - name: Free runner disk space for modern emulator images
        shell: bash
        run: |
          echo "Disk space before cleanup"
          df -h "$GITHUB_WORKSPACE"
          for path in \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/ndk-bundle" \
            "$ANDROID_HOME/cmake" \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost; do
            if [ -e "$path" ]; then
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          echo "Disk space after cleanup"
          df -h "$GITHUB_WORKSPACE"
      - name: Android 7 / latest available stable image smoke test
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          packages=(libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxrender1 libxtst6 libxkbcommon0)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then missing+=("$package"); fi
          done
          if ((${#missing[@]})); then
            # Azure mirrors may be supplied indirectly through apt-mirrors.txt.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
            fi
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$source" ]; then
                sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#https://archive.ubuntu.com/ubuntu/#g' -e 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$source"
              fi
            done
            install_apt() {
              timeout --signal=TERM --kill-after=10s 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update &&
              timeout --signal=TERM --kill-after=10s 150s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends "${missing[@]}"
            }
            if ! install_apt; then
              sleep 5
              if ! install_apt; then
                echo '::error::Ubuntu mirror unavailable. Emulator validation has not run.'
                exit 1
              fi
            fi
          fi
          if [ ! -e /dev/kvm ]; then echo '::error::KVM unavailable';exit 1;fi
          sudo chmod 666 /dev/kvm
          python3 artifacts/run_emulator.py "$TEST_API" artifacts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-api-${{ matrix.api }}-smoke-results
          path: |
            artifacts/avd-api-*.txt
            artifacts/emulator-api-*.log
            artifacts/instrumentation-api-*.txt
            artifacts/failure-api-*.txt
            artifacts/failure-preparation-api-*.txt
            artifacts/sdk-install-*.txt
          if-no-files-found: ignore

  publish:
    name: Publish active-code-v5.1.8 to GitHub Releases
    needs: [build, android-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: active-code-release-${{ needs.build.outputs.label }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.label }}
      BUILD_KIND: debug
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build.outputs.label }}-debug
          path: release-assets
      - name: Publish successful debug build
        shell: bash
        run: |
          set -euo pipefail
          # Distinct report names allow debug and signed APK/AAB in one release.
          for report in SHA256SUMS.txt APK-SIZES.txt; do
            if [ -f "release-assets/$report" ]; then
              mv "release-assets/$report" "release-assets/${RELEASE_TAG}-${BUILD_KIND}-${report}"
            fi
          done
          cat > release-notes.txt <<'NOTES'
          active-code-v5.1.8

          v5.1.8 UI correction: Group/Category rows compacted to 28px and two-line Channel rows to 36px (smaller on narrow screens), removing unwanted blank spaces. Playback and website unchanged.
          Debug APK is for testing. Signed release APK/AAB is added when the signed release workflow is run with the signing secrets configured.
          One APK supports armeabi-v7a and arm64-v8a. Checksums and size reports are included.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.txt
          fi
          # A debug rerun must not replace the canonical APK from a signed release.
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if [[ "$existing_assets" == *"${RELEASE_TAG}-release-SHA256SUMS.txt"* && "$existing_assets" == *"active-code.apk"* ]]; then
            rm -f release-assets/active-code.apk
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
